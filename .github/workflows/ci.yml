name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Frontend Dependencies & Build Web UI
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Download Go Modules
        run: go mod download

      - name: Run Go Unit Tests
        run: go test -v -tags "sqlite_omit_load_extension" ./...

      - name: Build Go Application Binary
        run: |
          CGO_ENABLED=0 go build -tags "sqlite_omit_load_extension" -ldflags="-w -s" -o stream-to-iptv ./cmd

      - name: Verify Docker Build
        run: |
          docker build -f docker/Dockerfile -t stream-to-iptv:test .
